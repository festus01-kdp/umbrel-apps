version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: kdp-bluray-verwaltung_web_1
      APP_PORT: 8080

  web:
    image: ghcr.io/festus01-kdp/bluray-verwaltung:1.1.0@sha256:89d2f54d54e02cad6d2b5af0a82ef3ae70dc6888641ae0143fd23f77d9e0d1f1
    user: "1000:1000"
    restart: on-failure
    volumes:
      # SQLite-Datenbank (Blu-Rays, Cover, Einstellungen) und Formular-Schlüssel
      - ${APP_DATA_DIR}/data:/data

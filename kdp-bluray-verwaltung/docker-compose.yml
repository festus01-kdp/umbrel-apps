version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: kdp-bluray-verwaltung_web_1
      APP_PORT: 8080

  web:
    image: ghcr.io/festus01-kdp/bluray-verwaltung:1.4.0@sha256:c7e0dcb574d517843f0652153eaea681ef4c763ef6f4b2b59bba466cadadfc94
    user: "1000:1000"
    restart: on-failure
    volumes:
      # SQLite-Datenbank (Blu-Rays, Cover, Einstellungen) und Formular-Schlüssel
      - ${APP_DATA_DIR}/data:/data

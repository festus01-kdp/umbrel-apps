version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: kdp-bluray-verwaltung_web_1
      APP_PORT: 8080

  web:
    image: ghcr.io/festus01-kdp/bluray-verwaltung:1.2.0@sha256:e4940f8b56a59b01efd835bd1ef0fc719a33772e768dea42d84ba45ea2c2c53c
    user: "1000:1000"
    restart: on-failure
    volumes:
      # SQLite-Datenbank (Blu-Rays, Cover, Einstellungen) und Formular-Schlüssel
      - ${APP_DATA_DIR}/data:/data

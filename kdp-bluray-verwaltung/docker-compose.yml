version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: kdp-bluray-verwaltung_web_1
      APP_PORT: 8080

  web:
    image: ghcr.io/festus01-kdp/bluray-verwaltung:1.3.2@sha256:c5e0ab71a76846d04ba9bf79760b57b81e6a7f5a9f1eb63dbf93ac55e58f78db
    user: "1000:1000"
    restart: on-failure
    volumes:
      # SQLite-Datenbank (Blu-Rays, Cover, Einstellungen) und Formular-Schlüssel
      - ${APP_DATA_DIR}/data:/data
